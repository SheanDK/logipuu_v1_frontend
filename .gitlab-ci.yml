image: node:18-alpine

variables:
  NPM_CONFIG_JOBS: 1

stages:
  - build

build-frontend:
  stage: build
  script:
    - apk add --no-cache python3 make g++ 
    - npm install --no-optional
    - NODE_OPTIONS=--max-old-space-size=1536 npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 week