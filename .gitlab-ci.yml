image: node:20-alpine

variables:
  # Node.js memory settings
  NODE_OPTIONS: "--max-old-space-size=4096"
  NODE_ENV: production
  # Next.js optimization
  NEXT_TELEMETRY_DISABLED: 1

cache:
  key: 
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .next/cache/

before_script:
  # Install system dependencies
  - apk add --no-cache python3 make g++ avahi-dev dbus-dev
  # Install npm packages
  - npm ci --prefer-offline --no-audit

stages:
  - build

build:
  stage: build
  script:
    # Clear old build files
    - rm -rf .next out
    # Build with optimization
    - npm run build
  artifacts:
    paths:
      - .next/
      - public/
      - package.json
    expire_in: 1 day
  only:
    - main
    - develop
  retry:
    max: 2
    when:
      - runner_system_failure