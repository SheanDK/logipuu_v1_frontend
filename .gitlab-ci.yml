image: node:20-slim

variables:
  UV_THREADPOOL_SIZE: 1
  NPM_CONFIG_JOBS: 1
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_PROGRESS: "false"

stages:
  - build

build-frontend:
  stage: build
  script:
    - apt-get update && apt-get install -y python3 make g++ libavahi-compat-libdnssd-dev
    - npm install --network-concurrency 1
    - NODE_OPTIONS=--max-old-space-size=1536 npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 week