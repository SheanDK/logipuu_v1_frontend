# GitLab CI/CD Configuration File

# Docker image එක define කරනවා
image: node:20-alpine

# Pipeline එකේ stages
stages:
  - build
  - test
  - deploy

# Cache configuration - node_modules cache කරන්න
cache:
  paths:
    - node_modules/

# Build stage
build:
  stage: build
  before_script:
    # Alpine Linux වල නිවැරදි packages install කරනවා
    - apk add --no-cache python3 make g++ avahi-dev avahi-compat-howl-dev
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/
      - dist/
    expire_in: 1 hour

# Test stage
test:
  stage: test
  before_script:
    - apk add --no-cache python3 make g++ avahi-dev avahi-compat-howl-dev
  script:
    - npm ci
    - npm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

# Deploy stage
deploy:
  stage: deploy
  before_script:
    - apk add --no-cache python3 make g++ avahi-dev avahi-compat-howl-dev
  script:
    - npm ci
    - npm run build
    - echo "Deploying application..."
    # ඔයාගේ deployment commands මෙතන add කරන්න
  only:
    - main
    - master